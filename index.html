<!DOCTYPE html>
<html lang="zh-CN" class="notranslate" translate="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="任务切换时的上下文记录小工具" />
  <meta name="google" content="notranslate" />
  <link rel="icon" href="icons/icon-48.png" type="image/png" sizes="48x48" />
  <link rel="icon" href="icons/icon-128.png" type="image/png" sizes="128x128" />
  <link rel="icon" href="icons/icon-512.png" type="image/png" sizes="512x512" />
  <link rel="apple-touch-icon" href="icons/icon-128.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <title>ResumePad — 任务上下文恢复</title>
  <script>
    (function () {
      var k = 'resumepad_theme';
      var t = localStorage.getItem(k);
      var dark = t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      var bg = dark ? '#0a0a0a' : '#fafafa';
      var fg = dark ? '#fafafa' : '#171717';
      document.documentElement.style.background = bg;
      document.documentElement.style.color = fg;
      if (/[?&]standalone(?:=1)?(?:&|$)/.test(location.search)) {
        document.documentElement.dataset.standalone = '1';
      }
      var sw = parseInt(localStorage.getItem('resumepad_sidebar_width'), 10);
      if (sw >= 160 && sw <= 480) {
        document.documentElement.style.setProperty('--sidebar-width', sw + 'px');
      }
    })();
  </script>
  <style>
    :root {
      --sidebar-width: 220px;
      color-scheme: light;
      --bg: #fafafa;
      --surface: #fff;
      --muted-surface: #f5f5f5;
      --ink: #171717;
      --muted: #737373;
      --border: #e5e5e5;
      --accent-hover: #404040;
      --danger: #dc2626;
      --toast-bg: #171717;
      --toast-fg: #fafafa;
      --backdrop: rgba(0, 0, 0, 0.4);
      --radius: 4px;
      --font: system-ui, -apple-system, "Segoe UI", "Noto Sans SC", sans-serif;
      --mono: ui-monospace, "SF Mono", monospace;
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #0a0a0a;
      --surface: #0a0a0a;
      --muted-surface: #141414;
      --ink: #fafafa;
      --muted: #a3a3a3;
      --border: #262626;
      --accent-hover: #d4d4d4;
      --danger: #f87171;
      --toast-bg: #fafafa;
      --toast-fg: #0a0a0a;
      --backdrop: rgba(0, 0, 0, 0.7);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--ink);
      line-height: 1.6;
      min-height: 100vh;
      font-size: 15px;
      -webkit-font-smoothing: antialiased;
    }

    .app {
      max-width: 960px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Electron（?standalone=1）：铺满窗口；启动完成前隐藏内容避免闪屏 */
    html[data-standalone="1"]:not([data-app-ready="1"]) .app {
      visibility: hidden;
    }

    html[data-standalone="1"],
    html[data-standalone="1"] body {
      margin: 0;
      height: 100%;
      min-height: 0;
      overflow: hidden;
    }

    html[data-standalone="1"] .app {
      width: 100%;
      max-width: none;
      height: 100%;
      margin: 0;
      min-height: 0;
    }

    html[data-standalone="1"] .topbar {
      flex-shrink: 0;
    }

    html[data-standalone="1"] .layout {
      flex: 1;
      min-height: 0;
    }

    html[data-standalone="1"] .sidebar {
      max-height: none;
      height: 100%;
      min-height: 0;
      overflow-y: auto;
    }

    html[data-standalone="1"] .main {
      min-height: 0;
      height: 100%;
      padding: 24px 32px 32px;
      overflow-y: auto;
      box-sizing: border-box;
    }

    .topbar, header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 10px 14px;
      flex-wrap: wrap;
    }

    button.brand {
      display: flex;
      align-items: center;
      gap: 8px;
      border: none;
      background: transparent;
      padding: 0;
      cursor: pointer;
      color: inherit;
      text-align: left;
    }

    button.brand:hover h1 { color: var(--accent-hover); }

    .brand-icon {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
      display: block;
    }

    .brand h1 {
      font-size: 0.875rem;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .brand p { display: none; }

    .toolbar, .header-actions {
      display: flex;
      align-items: center;
      gap: 2px;
      flex-wrap: wrap;
    }

    .toolbar button {
      padding: 4px 7px;
      font-size: 0.75rem;
    }

    button {
      font: inherit;
      font-size: 0.8125rem;
      cursor: pointer;
      border: none;
      background: transparent;
      color: var(--muted);
      padding: 4px 8px;
      border-radius: var(--radius);
      transition: color 0.15s, background 0.15s;
    }

    button:hover {
      color: var(--ink);
      background: var(--muted-surface);
    }

    button.primary {
      color: var(--bg);
      background: var(--ink);
      padding: 4px 10px;
    }

    button.primary:hover {
      background: var(--accent-hover);
      color: var(--bg);
    }

    button.danger:hover { color: var(--danger); }

    button.ghost-theme, button.icon-btn {
      font-size: 0.75rem;
      min-width: 2rem;
      padding: 4px 6px;
    }

    .layout {
      display: grid;
      grid-template-columns: var(--sidebar-width) 5px 1fr;
      flex: 1;
      border-top: 1px solid var(--border);
    }

    .sidebar-resizer {
      cursor: col-resize;
      touch-action: none;
      background: transparent;
      position: relative;
      margin: 0 -2px;
      z-index: 1;
    }

    .sidebar-resizer::after {
      content: '';
      position: absolute;
      left: 2px;
      top: 0;
      bottom: 0;
      width: 1px;
      background: var(--border);
    }

    .sidebar-resizer:hover,
    .sidebar-resizer.is-dragging {
      background: var(--muted-surface);
    }

    .sidebar-resizer.is-dragging::after {
      background: var(--muted);
    }

    @media (max-width: 720px) {
      .layout { grid-template-columns: 1fr; }
      .sidebar-resizer { display: none; }
      .sidebar {
        border-right: none;
        border-bottom: 1px solid var(--border);
        max-height: 40vh;
      }
    }

    .panel {
      background: transparent;
      border: none;
      box-shadow: none;
    }

    .sidebar {
      padding: 16px 0;
      max-height: calc(100vh - 52px);
      overflow-y: auto;
      min-width: 0;
    }

    .sidebar h2 {
      font-size: 0.6875rem;
      font-weight: 500;
      letter-spacing: 0.04em;
      color: var(--muted);
      padding: 0 20px 8px;
      text-transform: none;
    }

    .sidebar .schedule-block.queue-block {
      margin-top: 0;
      padding-top: 0;
    }

    .sidebar .schedule-block.completed-block {
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }

    .sidebar .schedule-block h2 {
      font-size: 0.6875rem;
      font-weight: 500;
      letter-spacing: 0.04em;
      color: var(--muted);
      padding: 0 20px 8px;
    }

    .sidebar .schedule-block .empty-list {
      padding-top: 0;
      padding-bottom: 8px;
    }

    .task-item .schedule-tag {
      display: inline-block;
      font-size: 0.625rem;
      font-weight: 500;
      letter-spacing: 0.03em;
      color: var(--muted);
      margin-bottom: 2px;
    }

    .task-list { list-style: none; }

    .task-item {
      padding: 10px 20px;
      cursor: pointer;
      border-left: 2px solid transparent;
    }

    .task-item:hover { background: var(--muted-surface); }

    .task-item.active {
      border-left-color: var(--ink);
      background: var(--muted-surface);
    }

    .task-item.history-item .title { font-weight: 400; }

    .task-item .title {
      font-weight: 500;
      font-size: 0.875rem;
      line-height: 1.4;
      word-break: break-word;
      white-space: pre-line;
    }

    .task-item .meta {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 2px;
    }

    .task-item .next-preview {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 4px;
      line-height: 1.35;
      word-break: break-word;
      white-space: pre-line;
    }

    .empty-list {
      padding: 12px 20px;
      color: var(--muted);
      font-size: 0.8125rem;
    }

    .main {
      min-height: 360px;
      padding: 32px 40px 48px;
      max-width: none;
    }

    @media (max-width: 720px) {
      .main { padding: 24px 20px 40px; }
    }

    .task-detail {
      max-width: 36rem;
      padding: 0;
    }

    .task-detail .badge {
      display: block;
      font-size: 0.6875rem;
      color: var(--muted);
      margin-bottom: 16px;
    }

    .task-detail .badge.done { color: var(--muted); }

    .task-detail #title.task-title {
      font-size: 1.375rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin: 0 0 6px;
      line-height: 1.3;
      width: 100%;
      box-sizing: border-box;
      border: 1px solid transparent;
      border-radius: var(--radius);
      background: transparent;
      padding: 10px 12px;
      color: var(--ink);
      min-height: 2.75rem;
    }

    .task-detail #title.task-title:focus {
      outline: none;
    }

    .task-detail .parked-at {
      color: var(--muted);
      font-size: 0.8125rem;
      margin: 0 0 32px;
    }

    .task-section {
      margin-bottom: 28px;
    }

    .task-section-title {
      margin-bottom: 0;
    }

    .task-detail:not(.is-editing):not(.is-history) .task-section {
      cursor: text;
    }

    .task-section h3 {
      display: block;
      font-size: 0.6875rem;
      font-weight: 500;
      letter-spacing: 0.04em;
      color: var(--muted);
      margin-bottom: 8px;
      text-transform: none;
    }

    .task-detail:not(.is-new) .title-label {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .task-detail .rich-input {
      font-size: 0.9375rem;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
      width: 100%;
      box-sizing: border-box;
      border: 1px solid transparent;
      border-radius: var(--radius);
      background: transparent;
      padding: 10px 12px;
      color: var(--ink);
      overflow-y: visible;
      min-height: 3.25rem;
    }

    .task-detail .task-section[data-field="goal"] .rich-input,
    .task-detail .task-section[data-field="srs"] .rich-input,
    .task-detail .task-section[data-field="progress"] .rich-input,
    .task-detail .task-section[data-field="references"] .rich-input {
      min-height: 5.5rem;
    }

    .task-detail .task-section[data-field="srs"] .rich-input,
    .task-detail .task-section[data-field="retrospective"] .rich-input {
      min-height: 9rem;
    }

    .task-attachments {
      margin-top: 8px;
    }

    .task-attachments-toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }

    .task-attachments-toolbar button {
      font-size: 0.75rem;
      padding: 4px 10px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--muted-surface);
      color: var(--ink);
    }

    .task-attachments-toolbar button:hover {
      background: var(--border);
    }

    .task-attachments-hint {
      font-size: 0.75rem;
      color: var(--muted);
      line-height: 1.45;
    }

    .task-attachments-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .task-attachment-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--muted-surface);
    }

    .task-attachment-open {
      flex: 1;
      min-width: 0;
      text-align: left;
      border: none;
      background: transparent;
      color: var(--ink);
      padding: 0;
      cursor: pointer;
      font: inherit;
      font-size: 0.875rem;
    }

    .task-attachment-open:hover {
      text-decoration: underline;
      background: transparent;
      color: var(--accent-hover);
    }

    .task-attachment-meta {
      font-size: 0.6875rem;
      color: var(--muted);
      flex-shrink: 0;
    }

    .task-attachment-remove {
      flex-shrink: 0;
      font-size: 0.75rem;
      padding: 2px 8px;
      color: var(--muted);
    }

    .task-attachment-remove:hover {
      color: var(--danger);
      background: transparent;
    }

    .task-attachment-download {
      flex-shrink: 0;
      font-size: 0.75rem;
      padding: 2px 8px;
      color: var(--muted);
    }

    .task-attachment-download:hover {
      color: var(--ink);
      background: transparent;
    }

    .task-attachments-empty {
      font-size: 0.8125rem;
      color: var(--muted);
      padding: 8px 12px;
      border: 1px dashed var(--border);
      border-radius: var(--radius);
    }

    .attachment-preview-overlay {
      position: fixed;
      inset: 0;
      z-index: 210;
      display: flex;
      align-items: stretch;
      justify-content: center;
      padding: 24px;
      background: rgba(0, 0, 0, 0.72);
      box-sizing: border-box;
    }

    .attachment-preview-overlay.hidden { display: none; }

    .attachment-preview-panel {
      width: min(960px, 100%);
      max-height: 100%;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.35);
      overflow: hidden;
    }

    .attachment-preview-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .attachment-preview-header h3 {
      font-size: 0.9375rem;
      font-weight: 600;
      margin: 0;
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .attachment-preview-header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .attachment-preview-mode-toggle,
    .attachment-preview-download {
      font-size: 0.75rem;
      padding: 4px 10px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--muted-surface);
      color: var(--ink);
    }

    .attachment-preview-mode-toggle:hover,
    .attachment-preview-download:hover {
      background: var(--border);
      color: var(--ink);
    }

    .attachment-preview-close {
      width: 2rem;
      height: 2rem;
      padding: 0;
      font-size: 1.25rem;
      line-height: 1;
      flex-shrink: 0;
    }

    .attachment-preview-body {
      flex: 1;
      min-height: 0;
      overflow: auto;
      padding: 0;
      background: var(--bg);
    }

    .attachment-preview-body iframe {
      display: block;
      width: 100%;
      min-height: min(70vh, 640px);
      border: none;
      background: #fff;
    }

    .attachment-preview-markdown {
      padding: 20px 24px 28px;
      font-size: 0.9375rem;
      line-height: 1.6;
      color: var(--ink);
      white-space: pre-wrap;
      word-break: break-word;
    }

    .attachment-preview-markdown h1,
    .attachment-preview-markdown h2,
    .attachment-preview-markdown h3 {
      margin: 1.2em 0 0.5em;
      line-height: 1.3;
    }

    .attachment-preview-markdown h1 { font-size: 1.375rem; }
    .attachment-preview-markdown h2 { font-size: 1.125rem; }
    .attachment-preview-markdown h3 { font-size: 1rem; }

    .attachment-preview-markdown p { margin: 0.6em 0; }
    .attachment-preview-markdown ul,
    .attachment-preview-markdown ol { margin: 0.6em 0; padding-left: 1.4em; }
    .attachment-preview-markdown code {
      font-family: var(--mono);
      font-size: 0.875em;
      background: var(--muted-surface);
      padding: 0.1em 0.35em;
      border-radius: 3px;
    }

    .attachment-preview-markdown pre {
      margin: 0.8em 0;
      padding: 12px;
      overflow: auto;
      background: var(--muted-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }

    .attachment-preview-markdown pre code {
      padding: 0;
      background: transparent;
    }

    .attachment-preview-markdown a {
      color: var(--ink);
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .attachment-preview-raw {
      margin: 0;
      padding: 16px 20px 24px;
      font-family: var(--mono);
      font-size: 0.8125rem;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
      color: var(--ink);
      background: var(--bg);
      min-height: min(70vh, 640px);
      box-sizing: border-box;
    }

    .attachment-preview-raw code {
      font-family: inherit;
      white-space: pre-wrap;
    }

    .task-detail .rich-input:focus {
      outline: none;
    }

    .task-detail [contenteditable]::spelling-error,
    .task-detail [contenteditable]::grammar-error {
      text-decoration: none;
      background: transparent;
    }

    .task-detail .rich-input.is-field-empty,
    .task-detail #title.task-title.is-field-empty {
      position: relative;
    }

    .task-detail .rich-input.is-field-empty::before,
    .task-detail #title.task-title.is-field-empty::before {
      position: absolute;
      left: 12px;
      right: 12px;
      top: 10px;
      white-space: pre-wrap;
      word-break: break-word;
      pointer-events: none;
    }

    .task-detail:not(.is-editing) .rich-input.is-field-empty::before,
    .task-detail:not(.is-editing) #title.task-title.is-field-empty::before {
      content: attr(data-preview-hint);
      color: var(--muted);
      opacity: 0.42;
    }

    .task-detail.is-editing #title.task-title,
    .task-detail.is-editing .rich-input {
      border-color: var(--border);
      background: var(--muted-surface);
    }

    .task-detail.is-editing .rich-input.is-field-empty::before,
    .task-detail.is-editing #title.task-title.is-field-empty::before {
      content: attr(data-placeholder);
      color: var(--muted);
      opacity: 0.55;
    }

    .task-detail.is-editing #title.task-title:focus,
    .task-detail.is-editing .rich-input:focus,
    .task-detail.is-editing .task-section:focus-within .rich-input {
      border-color: var(--ink);
      box-shadow: 0 0 0 1px var(--ink);
    }

    .task-detail.is-editing .task-section:focus-within h3 {
      color: var(--ink);
    }

    .linkified a {
      color: var(--ink);
      text-decoration: underline;
      text-underline-offset: 3px;
      word-break: break-all;
    }

    .linkified a:hover { color: var(--accent-hover); }


    .detail-actions,
    .resume-actions,
    .form-actions {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
      margin-top: 32px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
    }

    dialog.settings-dialog {
      max-width: 420px;
    }

    .settings-section {
      margin-bottom: 8px;
    }

    .settings-section h4 {
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--muted);
      margin-bottom: 12px;
    }

    .summary-include-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(10rem, 1fr));
      gap: 6px 12px;
    }

    .summary-include-grid label {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      color: var(--ink);
      font-weight: 400;
    }

    .summary-include-grid input {
      margin: 0;
      flex-shrink: 0;
      accent-color: var(--ink);
    }

    .locale-options {
      display: flex;
      flex-wrap: wrap;
      gap: 12px 20px;
    }

    .locale-options label {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      color: var(--ink);
      font-weight: 400;
    }

    .locale-options input {
      margin: 0;
      accent-color: var(--ink);
    }

    .summary-include-hint {
      grid-column: 1 / -1;
      margin-top: 10px;
      font-size: 0.75rem;
      color: var(--muted);
      line-height: 1.45;
    }

    .welcome {
      max-width: 28rem;
      padding-top: 32px;
    }

    .welcome h2 {
      font-size: 1.125rem;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .welcome-lead {
      font-size: 0.9375rem;
      line-height: 1.6;
      color: var(--ink);
      margin-bottom: 8px;
    }

    .welcome-hint {
      font-size: 0.8125rem;
      line-height: 1.55;
      color: var(--muted);
    }

    .welcome kbd {
      font-family: var(--mono);
      font-size: 0.75rem;
      padding: 1px 6px;
      border: 1px solid var(--border);
      border-radius: 3px;
      background: var(--muted-surface);
    }

    .task-section-title { position: relative; }


    .rich-input img {
      max-width: 100%;
      height: auto;
      display: block;
      margin: 8px 0;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      cursor: zoom-in;
    }

    .rich-input a.rich-auto-link {
      color: var(--ink);
      text-decoration: underline;
      text-underline-offset: 3px;
      word-break: break-all;
      cursor: pointer;
    }

    .rich-input a.rich-auto-link:hover {
      color: var(--accent-hover);
    }

    #title::placeholder {
      color: var(--muted);
      opacity: 0.6;
    }

    .rich-body img {
      max-width: 100%;
      height: auto;
      display: block;
      margin: 8px 0;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      cursor: zoom-in;
    }

    .image-preview-overlay {
      position: fixed;
      inset: 0;
      z-index: 200;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      justify-content: stretch;
      padding: 24px;
      background: rgba(0, 0, 0, 0.78);
      box-sizing: border-box;
      cursor: zoom-out;
    }

    .image-preview-overlay.hidden { display: none; }

    .image-preview-stage {
      flex: 1;
      min-height: 0;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      cursor: grab;
    }

    .image-preview-overlay.is-panning .image-preview-stage {
      cursor: grabbing;
    }

    .image-preview-overlay .image-preview-img {
      max-width: min(96vw, 100%);
      max-height: 96vh;
      width: auto;
      height: auto;
      object-fit: contain;
      border: none;
      border-radius: var(--radius);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
      cursor: inherit;
      transform-origin: center center;
      will-change: transform;
      user-select: none;
      -webkit-user-drag: none;
    }

    .image-preview-close {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 2.25rem;
      height: 2.25rem;
      padding: 0;
      font-size: 1.25rem;
      line-height: 1;
      color: #fff;
      background: rgba(255, 255, 255, 0.12);
      border-radius: var(--radius);
    }

    .image-preview-close:hover {
      background: rgba(255, 255, 255, 0.22);
      color: #fff;
    }


    .kbd {
      font-family: var(--mono);
      font-size: 0.6875rem;
      color: var(--muted);
    }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(8px);
      background: var(--toast-bg);
      color: var(--toast-fg);
      padding: 8px 14px;
      border-radius: var(--radius);
      font-size: 0.8125rem;
      opacity: 0;
      transition: opacity 0.2s, transform 0.2s;
      pointer-events: none;
      z-index: 100;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    dialog {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      max-width: 380px;
      background: var(--surface);
      color: var(--ink);
      box-shadow: none;
    }

    dialog::backdrop { background: var(--backdrop); }

    dialog h3 {
      font-size: 0.9375rem;
      font-weight: 600;
      margin-bottom: 8px;
    }

    dialog p {
      font-size: 0.875rem;
      color: var(--muted);
      line-height: 1.5;
    }

    dialog .actions {
      display: flex;
      gap: 4px;
      justify-content: flex-end;
      margin-top: 20px;
      flex-wrap: wrap;
    }

    .hidden { display: none !important; }
  </style>

<body>
  <div class="app">
    <header class="topbar">
      <button type="button" class="brand" id="btnHome" data-i18n-title="nav.homeTitle">
        <img class="brand-icon" src="icons/icon.svg" alt="" width="20" height="20" />
        <h1>ResumePad</h1>
      </button>
      <nav class="toolbar">
        <button type="button" id="btnSettings" data-i18n="nav.settings" data-i18n-title="nav.settingsTitle">设置</button>
        <button type="button" id="btnExport" data-i18n="nav.export" data-i18n-title="nav.exportTitle">导出</button>
        <button type="button" id="btnImport" data-i18n="nav.import">导入</button>
        <button type="button" id="btnNew" data-i18n="nav.switch" data-i18n-title="nav.switchTitle">Switch</button>
        <input type="file" id="importFile" accept=".json" class="hidden" />
      </nav>
    </header>

    <div class="layout" id="layout">
      <aside class="sidebar">
        <div class="schedule-block queue-block" id="queueBlock">
          <h2><span data-i18n="sidebar.queued">排队中</span> · <span id="queueCount">0</span></h2>
          <p class="empty-list hidden" id="emptyQueue"></p>
          <ul class="task-list" id="queueList"></ul>
        </div>
        <div class="schedule-block completed-block" id="completedBlock">
          <h2><span data-i18n="sidebar.completed">已完成</span> · <span id="historyCount">0</span></h2>
          <p class="empty-list hidden" id="emptyHistory"></p>
          <ul class="task-list" id="historyList"></ul>
        </div>
      </aside>
      <div
        class="sidebar-resizer"
        id="sidebarResizer"
        role="separator"
        aria-orientation="vertical"
        data-i18n-aria="sidebar.resizerLabel"
        tabindex="0"
      ></div>

      <main class="main" id="mainPanel">
        <section class="welcome" id="welcomeView">
          <h2 data-i18n="welcome.title">选择任务</h2>
          <p class="welcome-lead" data-i18n="welcome.lead">在左侧选择排队中的任务，恢复工作上下文。</p>
          <p class="welcome-hint" id="welcomeHint"></p>
        </section>
        <section class="task-detail hidden" id="taskDetailView">
          <form id="taskForm">
            <input type="hidden" id="taskId" />
            <span class="badge hidden" id="detailBadge">排队中</span>
            <section class="task-section task-section-title" data-field="title">
              <h3 class="title-label" data-i18n-field="title">任务名称</h3>
              <div
                id="title"
                class="task-title rich-input"
                contenteditable="true"
                role="textbox"
              ></div>
            </section>
            <p class="parked-at hidden" id="detailMeta"></p>
            <section class="task-section" data-field="goal">
              <h3 data-i18n-field="goal">要达成什么</h3>
              <div id="goal" class="rich-input" contenteditable="true"></div>
            </section>
            <section class="task-section" data-field="srs">
              <h3 data-i18n-field="srs">软件需求（SRS）</h3>
              <div id="srs" class="rich-input srs" contenteditable="true"></div>
            </section>
            <section class="task-section" data-field="progress">
              <h3 data-i18n-field="progress">做到哪了</h3>
              <div id="progress" class="rich-input" contenteditable="true"></div>
            </section>
            <section class="task-section" data-field="nextAction">
              <h3 data-i18n-field="nextAction">下一步 · 立刻做</h3>
              <div id="nextAction" class="rich-input" contenteditable="true"></div>
            </section>
            <section class="task-section" data-field="references">
              <h3 data-i18n-field="references">关键引用</h3>
              <div id="references" class="rich-input refs" contenteditable="true"></div>
            </section>
            <section class="task-section" data-field="blockers">
              <h3 data-i18n-field="blockers">卡点 / 未决</h3>
              <div id="blockers" class="rich-input" contenteditable="true"></div>
            </section>
            <section class="task-section" data-field="notes">
              <h3 data-i18n-field="notes">备忘</h3>
              <div id="notes" class="rich-input" contenteditable="true"></div>
            </section>
            <section class="task-section" data-field="retrospective">
              <h3 data-i18n-field="retrospective">复盘总结</h3>
              <div id="retrospective" class="rich-input retrospective" contenteditable="true"></div>
            </section>
            <section class="task-section task-attachments-section" data-field="attachments">
              <h3 data-i18n-field="attachments">附件</h3>
              <div class="task-attachments" id="taskAttachments">
                <div class="task-attachments-toolbar hidden" id="attachmentsToolbar">
                  <button type="button" id="btnUploadAttachment" data-i18n="attachments.upload">上传附件</button>
                  <span class="task-attachments-hint" data-i18n="attachments.hint">支持 .html / .htm / .md，单击预览</span>
                  <input type="file" id="attachmentFile" accept=".html,.htm,.md,.markdown,text/html,text/markdown,text/plain" class="hidden" multiple />
                </div>
                <div id="attachmentsListHost"></div>
              </div>
            </section>
            <div class="detail-actions" id="detailViewActions"></div>
            <div class="detail-actions hidden" id="detailEditActions">
              <button type="submit" id="btnSaveForm" data-i18n="actions.save">保存</button>
              <button type="button" id="btnCancelForm" data-i18n="actions.cancel">取消</button>
            </div>
          </form>
        </section>
      </main>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <div class="image-preview-overlay hidden" id="imagePreviewOverlay" role="dialog" aria-modal="true" aria-label="Image preview">

    <div class="image-preview-stage" id="imagePreviewStage">

  </div>

        </div>
      </div>
      <div class="attachment-preview-body" id="attachmentPreviewBody"></div>
    </div>
  </div>

  <dialog id="confirmDialog">
    <h3 id="confirmTitle">确认</h3>

    <div class="actions">
      <button type="button" id="confirmCancel" data-i18n="actions.cancel">取消</button>
      <button type="button" class="danger" id="confirmOk" data-i18n="actions.confirm">确定</button>
    </div>
  </dialog>

  <dialog id="importDialog">

    const idb = {
      db: null,
      open() {
        if (this.db) return Promise.resolve(this.db);
        return new Promise((resolve, reject) => {
          const req = indexedDB.open(DB_NAME, DB_VERSION);
          req.onerror = () => reject(req.error);
          req.onsuccess = () => {
            this.db = req.result;
            resolve(this.db);
          };
          req.onupgradeneeded = (e) => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains(STORE)) {
              db.createObjectStore(STORE);
            }
          };
        });
      },
      async get(key) {
        await this.open();
        return new Promise((resolve, reject) => {
          const tx = this.db.transaction(STORE, 'readonly');
          const req = tx.objectStore(STORE).get(key);
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => reject(req.error);
        });
      },
      async set(key, value) {
        await this.open();
        return new Promise((resolve, reject) => {
          const tx = this.db.transaction(STORE, 'readwrite');
          const req = tx.objectStore(STORE).put(value, key);
          req.onsuccess = () => resolve();
          req.onerror = () => reject(req.error);
        });
      },
    };

    function compressImageFile(file) {
      return new Promise((resolve, reject) => {
        const url = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => {
          URL.revokeObjectURL(url);
          let w = img.naturalWidth;
          let h = img.naturalHeight;
          if (w > MAX_IMAGE_WIDTH) {
            h = Math.round(h * MAX_IMAGE_WIDTH / w);
            w = MAX_IMAGE_WIDTH;
          }
          const canvas = document.createElement('canvas');
          canvas.width = w;
          canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          const usePng = file.type === 'image/png';
          const mime = usePng ? 'image/png' : 'image/jpeg';
          resolve(canvas.toDataURL(mime, usePng ? undefined : 0.85));
        };
        img.onerror = () => {
          URL.revokeObjectURL(url);
          reject(new Error('decode'));
        };
        img.src = url;
      });
    }

    function isRichContent(s) {

        .replace(/<br\s*\/?>/gi, '\n')
        .replace(/<\/div>\s*<div[^>]*>/gi, '\n')
        .replace(/<\/p>\s*<p[^>]*>/gi, '\n');
      const d = document.createElement('div');
      d.innerHTML = normalized;
      return (d.innerText || d.textContent || '').replace(/\r\n?/g, '\n');
    }

      const ext = getAttachmentExtension(name);
      if (ext === 'html' || ext === 'htm') return 'html';
      if (ext === 'md' || ext === 'markdown') return 'markdown';
      if (mime === 'text/html') return 'html';
      if (mime === 'text/markdown') return 'markdown';
      return null;

    function renderMarkdownBasic(md) {
      const lines = String(md).replace(/\r\n?/g, '\n').split('\n');
      const out = [];
      let inPre = false;
      let preBuf = [];

      const flushPre = () => {
        if (!preBuf.length) return;
        out.push(`<pre><code>${escapeHtml(preBuf.join('\n'))}</code></pre>`);
        preBuf = [];
      };

      for (const line of lines) {
        if (line.trim().startsWith('```')) {
          if (inPre) {
            flushPre();
            inPre = false;
          } else {
            inPre = true;
          }
          continue;
        }
        if (inPre) {
          preBuf.push(line);
          continue;
        }
        let s = escapeHtml(line);
        if (/^###\s+/.test(s)) {
          out.push(`<h3>${s.replace(/^###\s+/, '')}</h3>`);
          continue;
        }
        if (/^##\s+/.test(s)) {
          out.push(`<h2>${s.replace(/^##\s+/, '')}</h2>`);
          continue;
        }
        if (/^#\s+/.test(s)) {
          out.push(`<h1>${s.replace(/^#\s+/, '')}</h1>`);
          continue;
        }
        s = s
          .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
          .replace(/`([^`]+)`/g, '<code>$1</code>')
          .replace(
            /\[([^\]]+)\]\(([^)]+)\)/g,
            '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>',
          );
        if (!s.trim()) {
          out.push('');
          continue;
        }
        out.push(`<p>${s}</p>`);
      }
      flushPre();
      return out.join('');
    }

    function attachmentMimeType(att) {
      return att.kind === 'html' ? 'text/html;charset=utf-8' : 'text/markdown;charset=utf-8';
    }

    function safeAttachmentFileName(name) {
      const base = String(name || 'attachment').replace(/[/\\]/g, '_').trim() || 'attachment';
      return base;

    function downloadAttachment(att) {
      if (!att?.content) return;
      const mime = attachmentMimeType(att);
      const blob = new Blob([att.content], { type: mime });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = safeAttachmentFileName(att.name);
      a.rel = 'noopener';
      a.click();
      URL.revokeObjectURL(url);
      toast(t('toast.attachmentDownloaded'));
    }

    async function handleAttachmentFiles(fileList) {
      const files = [...fileList];
      if (!files.length) return;
      let added = 0;
      for (const file of files) {
        const kind = detectAttachmentKind(file.name, file.type);
        if (!kind) {
          toast(t('toast.attachmentBadType'));
          continue;
        }
        if (file.size > MAX_ATTACHMENT_BYTES) {
          toast(tf('toast.attachmentTooLarge', { max: formatBytes(MAX_ATTACHMENT_BYTES) }));
          continue;
        }
        const content = await file.text();
        draftAttachments.push({
          id: uid(),
          name: file.name,
          kind,
          content,
          uploadedAt: new Date().toISOString(),
        });
        added += 1;
      }
      if (!added) return;
      if ($('#taskId').value) {
        try {
          await persistDraftAttachmentsToTask();
        } catch {
          return;
        }
      }
      renderAttachmentsPanel(isTaskEditing());
      toast(t('toast.attachmentAdded'));

    function sanitizeRichHtml(html) {
      const root = document.createElement('div');
      root.innerHTML = html;

      function walk(node) {
        if (node.nodeType === Node.TEXT_NODE) {
          return document.createTextNode(node.textContent);
        }
        if (node.nodeType !== Node.ELEMENT_NODE) return null;
        const tag = node.tagName.toLowerCase();
        if (tag === 'img') {
          const src = node.getAttribute('src') || '';
          if (!src.startsWith('data:image/')) return null;
          const img = document.createElement('img');
          img.src = src;
          img.alt = '';
          return img;
        }
        if (tag === 'br') return document.createElement('br');
        if (tag === 'a') {
          return document.createTextNode(node.textContent || '');
        }
        if (tag === 'p' || tag === 'div' || tag === 'span') {
          const el = document.createElement(tag === 'span' ? 'span' : 'div');
          [...node.childNodes].forEach((ch) => {
            const c = walk(ch);
            if (c) el.appendChild(c);
          });
          return el;
        }
        const frag = document.createDocumentFragment();
        [...node.childNodes].forEach((ch) => {
          const c = walk(ch);
          if (c) frag.appendChild(c);
        });
        return frag.childNodes.length ? frag : null;
      }

      const out = document.createElement('div');
      [...root.childNodes].forEach((ch) => {
        const c = walk(ch);
        if (!c) return;
        if (c instanceof DocumentFragment) out.appendChild(c);
        else out.appendChild(c);
      });
      return out.innerHTML;
    }

    function getRichValue(id) {

      return sanitizeRichHtml(html);
    }

    function setRichValue(id, value, opts = {}) {

      if (!el) return;

      syncRichFieldEmptyState(el);
    }

    function insertImageAtCursor(field, dataUrl) {
      field.focus();
      const img = document.createElement('img');
      img.src = dataUrl;
      img.alt = '';
      const sel = window.getSelection();
      if (!sel || sel.rangeCount === 0 || !field.contains(sel.anchorNode)) {
        field.appendChild(document.createElement('br'));
        field.appendChild(img);
        field.appendChild(document.createElement('br'));
        return;
      }
      const range = sel.getRangeAt(0);
      range.deleteContents();
      const br = document.createElement('br');
      range.insertNode(br);
      range.insertNode(img);
      range.setStartAfter(br);
      range.collapse(true);
      sel.removeAllRanges();
      sel.addRange(range);
    }

    async function insertImageInField(field, file) {
      if (!file?.type.startsWith('image/')) return false;
      try {
        const dataUrl = await compressImageFile(file);
        insertImageAtCursor(field, dataUrl);
        field.dispatchEvent(new Event('input', { bubbles: true }));
        toast(t('toast.imageInserted'));
        return true;
      } catch {
        toast(t('toast.imageFailed'));
        return false;
      }
    }

    function initRichFields() {
      ['title', ...RICH_FIELDS].forEach((id) => {
        const el = document.getElementById(id);
        if (!el) return;
        el.spellcheck = false;
        el.setAttribute('autocorrect', 'off');
        el.setAttribute('autocomplete', 'off');
        /* preview hints set in applyFieldLocales */
        bindRichFieldLinkify(el);
        el.addEventListener('input', () => {
          const wasEmpty = el.classList.contains('is-field-empty');
          syncRichFieldEmptyState(el);
          if (!wasEmpty && el.classList.contains('is-field-empty') && document.activeElement === el) {
            placeCaretInEmptyRich(el);
          }
        });
        el.addEventListener('focus', () => {
          if (!$('#taskDetailView')?.classList.contains('is-editing')) return;
          if (isRichFieldEmpty(el)) placeCaretInEmptyRich(el);
        });
        el.addEventListener('paste', async (e) => {
          const items = e.clipboardData?.items;
          if (!items) return;
          for (const item of items) {
            if (!item.type.startsWith('image/')) continue;
            e.preventDefault();
            const file = item.getAsFile();
            if (file) await insertImageInField(el, file);
            return;
          }
        });
        el.addEventListener('dragover', (e) => e.preventDefault());
        el.addEventListener('drop', async (e) => {
          const files = [...(e.dataTransfer?.files || [])].filter((f) => f.type.startsWith('image/'));
          if (!files.length) return;
          e.preventDefault();
          for (const file of files) {
            await insertImageInField(el, file);
          }
        });
        el.addEventListener('keydown', (e) => {
          if (!$('#taskDetailView')?.classList.contains('is-editing')) return;
          if (e.key === 'Tab') {
            const idx = EDIT_FIELD_ORDER.indexOf(el.id);
            if (idx === -1) return;
            if (e.shiftKey) {
              if (idx === 0) return;
              e.preventDefault();
              focusFormField(EDIT_FIELD_ORDER[idx - 1], { collapse: 'end' });
              return;
            }
            if (idx < EDIT_FIELD_ORDER.length - 1) {
              e.preventDefault();
              focusFormField(EDIT_FIELD_ORDER[idx + 1], { collapse: 'end' });
            }
            return;
          }
          if (e.key !== 'Enter' || e.isComposing) return;
          if (e.altKey) {
            e.preventDefault();
            if (document.queryCommandSupported('insertLineBreak')) {
              document.execCommand('insertLineBreak');
            } else {
              document.execCommand('insertHTML', false, '<br>');
            }
            return;
          }
          e.preventDefault();
          void submitFormEdit();
        });
      });
    }

    async function migrateFromLocalStorage() {
      try {
        const raw = localStorage.getItem(LEGACY_STORAGE_KEY);
        if (!raw) return;
        const legacy = JSON.parse(raw);
        if (!Array.isArray(legacy) || legacy.length === 0) {
          localStorage.removeItem(LEGACY_STORAGE_KEY);
          return;
        }
        const existing = await idb.get(DATA_KEY);
        if (!existing || !existing.tasks?.length) {
          tasks = legacy.map(normalizeTask).filter(Boolean);
          await persistData();
        }
        localStorage.removeItem(LEGACY_STORAGE_KEY);
        toast(t('toast.migratedIdb'));
      } catch {
        /* ignore */
      }
    }

    async function load() {
      try {
        const data = await idb.get(DATA_KEY);
        let hadStoredSummarySettings = false;
        if (data && typeof data === 'object') {
          tasks = (data.tasks || []).map(normalizeTask).filter(Boolean);
          history = (data.history || []).map(normalizeTask).filter(Boolean);
          if (
            data.settings &&
            typeof data.settings.summaryInclude === 'object' &&
            data.settings.summaryInclude !== null
          ) {
            applySettingsFromStored(data.settings);
            hadStoredSummarySettings = true;
          } else {
            applySettingsFromStored(null);
          }
        } else {
          tasks = [];
          history = [];
          applySettingsFromStored(null);
        }
        if (hadStoredSummarySettings) {
          try {
            localStorage.removeItem(SUMMARY_INCLUDE_LS_KEY_LEGACY);
          } catch { /* ignore */ }
        } else if (migrateLegacySummaryIncludeFromLocalStorage()) {
          await persistData();
        }
      } catch (e) {
        console.error(e);
        tasks = [];
        history = [];
        applySettingsFromStored(null);
        toast(t('toast.loadFailed'));
      }
      migrateScheduleStates();
    }

    async function persistData() {
      const payload = getExportPayload();
      try {
        await idb.set(DATA_KEY, payload);
        await idb.set('mirrorBackup', payload);
      } catch (e) {
        const msg = e && e.name === 'QuotaExceededError'
          ? t('toast.quotaExceeded')
          : tf('toast.saveFailed', { msg: e.message || e });
        toast(msg);
        throw e;
      }
    }

    async function save() {
      await persistData();
    }

    const SIDEBAR_WIDTH_KEY = 'resumepad_sidebar_width';
    const SIDEBAR_WIDTH_MIN = 160;
    const SIDEBAR_WIDTH_MAX = 480;
    const SIDEBAR_WIDTH_DEFAULT = 220;
    const SIDEBAR_RESIZE_MQ = '(max-width: 720px)';

    function setSidebarWidth(px) {
      const w = Math.round(Math.min(SIDEBAR_WIDTH_MAX, Math.max(SIDEBAR_WIDTH_MIN, px)));
      document.documentElement.style.setProperty('--sidebar-width', w + 'px');
      return w;
    }

    function initSidebarResize() {
      const layout = $('#layout');
      const resizer = $('#sidebarResizer');
      if (!layout || !resizer) return;

      const mql = window.matchMedia(SIDEBAR_RESIZE_MQ);
      if (mql.matches) return;

      let dragging = false;
      let currentWidth = 0;

      function persistWidth(w) {
        try {
          localStorage.setItem(SIDEBAR_WIDTH_KEY, String(w));
        } catch { /* layout only */ }
      }

      function widthFromPointer(clientX) {
        return setSidebarWidth(clientX - layout.getBoundingClientRect().left);
      }

      function endDrag() {
        if (!dragging) return;
        dragging = false;
        resizer.classList.remove('is-dragging');
        document.body.style.cursor = '';
        document.body.style.userSelect = '';
        persistWidth(currentWidth);
      }

      resizer.addEventListener('pointerdown', (e) => {
        if (mql.matches) return;
        e.preventDefault();
        resizer.setPointerCapture(e.pointerId);
        dragging = true;
        currentWidth = widthFromPointer(e.clientX);
        resizer.classList.add('is-dragging');
        document.body.style.cursor = 'col-resize';
        document.body.style.userSelect = 'none';
      });

      resizer.addEventListener('pointermove', (e) => {
        if (!dragging) return;
        currentWidth = widthFromPointer(e.clientX);
      });

      resizer.addEventListener('pointerup', endDrag);
      resizer.addEventListener('pointercancel', endDrag);

      resizer.addEventListener('dblclick', () => {
        if (mql.matches) return;
        currentWidth = setSidebarWidth(SIDEBAR_WIDTH_DEFAULT);
        persistWidth(currentWidth);
      });

      resizer.addEventListener('keydown', (e) => {
        if (mql.matches) return;
        let delta = 0;
        if (e.key === 'ArrowLeft') delta = -16;
        else if (e.key === 'ArrowRight') delta = 16;
        else if (e.key === 'Home') {
          currentWidth = setSidebarWidth(SIDEBAR_WIDTH_MIN);
          persistWidth(currentWidth);
          e.preventDefault();
          return;
        }
        if (e.key === 'End') {
          currentWidth = setSidebarWidth(SIDEBAR_WIDTH_MAX);
          persistWidth(currentWidth);
          e.preventDefault();
          return;
        }
        if (!delta) return;
        e.preventDefault();
        const parsed = parseInt(
          getComputedStyle(document.documentElement).getPropertyValue('--sidebar-width'),
          10,
        );
        const base = Number.isFinite(parsed) ? parsed : SIDEBAR_WIDTH_DEFAULT;
        currentWidth = setSidebarWidth(base + delta);
        persistWidth(currentWidth);
      });
    }

    function formatRelative(iso) {
      const d = new Date(iso);
      const diff = Date.now() - d.getTime();
      const mins = Math.floor(diff / 60000);
      const tag = localeTag();
      if (mins < 1) return t('time.justNow');
      if (mins < 60) return tf('time.minsAgo', { n: mins });
      const hrs = Math.floor(mins / 60);
      if (hrs < 24) return tf('time.hrsAgo', { n: hrs });
      const days = Math.floor(hrs / 24);
      if (days < 7) return tf('time.daysAgo', { n: days });
      return d.toLocaleString(tag, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    }

    function formatFull(iso) {
      return new Date(iso).toLocaleString(localeTag(), {
        year: 'numeric', month: 'long', day: 'numeric',
        hour: '2-digit', minute: '2-digit',
      });
    }

    }
