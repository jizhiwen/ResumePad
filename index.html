    function escapeHtml(s) {
      const d = document.createElement('div');
      d.textContent = s || '';
      return d.innerHTML;
    }

    function safeHref(url) {
      const href = /^https?:\/\//i.test(url) ? url : `https://${url}`;
      try {
        return new URL(href).href;
      } catch {
        return null;
      }
    }


    const AUTO_LINK_RE = /(?:https?:\/\/|www\.)[^\s<>"')\]]+/gi;

    function createAutoLinkNode(url) {
      const href = safeHref(url);
      if (!href) return document.createTextNode(url);
      const a = document.createElement('a');
      a.href = href;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.className = 'rich-auto-link';
      a.contentEditable = 'false';
      a.textContent = url;
      return a;
    }

    function linkifyTextToFragment(text) {
      const frag = document.createDocumentFragment();
      let last = 0;
      const re = new RegExp(AUTO_LINK_RE.source, AUTO_LINK_RE.flags);
      let m;
      while ((m = re.exec(text)) !== null) {
        if (m.index > last) {
          frag.appendChild(document.createTextNode(text.slice(last, m.index)));
        }
        frag.appendChild(createAutoLinkNode(m[0]));
        last = m.index + m[0].length;
      }
      if (last < text.length) {
        frag.appendChild(document.createTextNode(text.slice(last)));
      }
      return frag;
    }

    function captureFocusSnapshot() {
      const el = document.activeElement;
      if (!el || !document.body.contains(el)) return null;
      if (el instanceof HTMLInputElement || el instanceof HTMLTextAreaElement) {
        return { kind: 'input', el, start: el.selectionStart, end: el.selectionEnd };
      }
      const rich = el.closest?.('.rich-input');
      if (rich) {
        const sel = window.getSelection();
        if (!sel?.rangeCount) return { kind: 'rich', el: rich, range: null };
        const range = sel.getRangeAt(0);
        if (!rich.contains(range.commonAncestorContainer)) {
          return { kind: 'rich', el: rich, range: null };
        }
        return { kind: 'rich', el: rich, range: range.cloneRange() };
      }
      return { kind: 'element', el };
    }

    function restoreFocusSnapshot(snap) {
      if (!snap?.el || !document.body.contains(snap.el)) return;
      try {
        if (snap.kind === 'input') {
          snap.el.focus({ preventScroll: true });
          snap.el.setSelectionRange(snap.start ?? 0, snap.end ?? 0);
          return;
        }
        if (snap.kind === 'rich') {
          snap.el.focus({ preventScroll: true });
          if (snap.range) {
            const sel = window.getSelection();
            sel?.removeAllRanges();
            sel?.addRange(snap.range);
          }
          return;
        }
        snap.el.focus({ preventScroll: true });
      } catch {
        /* range may be stale after DOM rewrite */
      }
    }

    function caretRangeFromPoint(x, y) {
      if (document.caretRangeFromPoint) {
        try {
          return document.caretRangeFromPoint(x, y);
        } catch {
          /* ignore */
        }
      }
      const pos = document.caretPositionFromPoint?.(x, y);
      if (!pos) return null;
      const range = document.createRange();
      range.setStart(pos.offsetNode, pos.offset);
      range.collapse(true);
      return range;
    }

    function normalizeCaretRangeForField(fieldId, range) {
      if (!range || !fieldId) return null;
      const el = document.getElementById(fieldId);
      if (!el || isRichFieldEmpty(el) || !el.contains(range.commonAncestorContainer)) return null;
      try {
        return range.cloneRange();
      } catch {
        return null;
      }
    }

    function restoreDocumentScroll(scrollY, mainScroll) {
      window.scrollTo(0, scrollY);
      const mainEl = $('.main');
      if (mainEl) mainEl.scrollTop = mainScroll;
    }

    function linkifyAllRichFormFields() {
      const snap = captureFocusSnapshot();
      ['title', ...RICH_FIELDS].forEach((id) => {
        const el = document.getElementById(id);
        if (el) linkifyRichElement(el);
      });
      if (isTaskEditing()) restoreFocusSnapshot(snap);
    }

    function linkifyRichElement(el) {
      if (!el) return;
      const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
      const nodes = [];
      let n;
      while ((n = walker.nextNode())) {
        if (n.parentElement?.closest('a.rich-auto-link, img')) continue;
        if (!AUTO_LINK_RE.test(n.textContent || '')) continue;
        AUTO_LINK_RE.lastIndex = 0;
        nodes.push(n);
      }
      nodes.forEach((textNode) => {
        const parent = textNode.parentNode;
        if (!parent) return;
        parent.replaceChild(linkifyTextToFragment(textNode.textContent), textNode);
      });
    }

    const richLinkifyTimers = new WeakMap();

    function scheduleLinkifyRichField(el) {
      if (!el) return;
      const prev = richLinkifyTimers.get(el);
      if (prev) clearTimeout(prev);
      richLinkifyTimers.set(
        el,
        setTimeout(() => {
          const snap = el.contains(document.activeElement) ? captureFocusSnapshot() : null;
          linkifyRichElement(el);
          restoreFocusSnapshot(snap);
        }, 200),
      );
    }

    function bindRichFieldLinkify(el) {
      if (!el || el.dataset.linkifyBound === '1') return;
      el.dataset.linkifyBound = '1';
      let composing = false;
      el.addEventListener('compositionstart', () => {
        composing = true;
      });
      el.addEventListener('compositionend', () => {
        composing = false;
        scheduleLinkifyRichField(el);
      });
      el.addEventListener('input', () => {
        if (!composing) scheduleLinkifyRichField(el);
      });
      el.addEventListener('click', (e) => {
        const a = e.target.closest('a.rich-auto-link');
        if (!a) return;
        e.preventDefault();
        window.open(a.href, '_blank', 'noopener,noreferrer');
      });
    }

    function linkifyHtml(escapedHtml) {
      return escapedHtml.replace(
        /(?:https?:\/\/|www\.)[^\s<>&"')\]]+/gi,
        (match) => {
          const href = safeHref(match);
          if (!href) return match;
          return `<a href="${escapeHtml(href)}" target="_blank" rel="noopener noreferrer">${match}</a>`;
        },
      );
    }

    function block(label, body, opts = {}) {
      const cls = 'context-block';
      const sectionCls = opts.field ? `${cls} editable-block` : cls;
      const fieldAttr = opts.field ? ` data-field="${opts.field}"` : '';
      let inner;
      if (!hasFieldContent(body)) {
        const hintKey = opts.fieldKey ?? opts.field;
        const hint =
          opts.emptyHint ||
          (hintKey && t(`placeholders.${hintKey}`)) ||
          '';
        const hintHtml = hint
          ? `<span class="empty-hint">${escapeHtml(hint)}</span>`
          : '';
        inner = `<div class="body is-empty">${hintHtml}</div>`;
      } else if (isRichContent(body)) {
        const html = sanitizeRichHtml(body);
        inner = `<div class="body rich-body linkified">${html}</div>`;
      } else {
        const linked = linkifyHtml(escapeHtml(body));
        inner = `<div class="body linkified">${linked}</div>`;
      }
      return `<section class="${sectionCls}"${fieldAttr}><h3>${label}</h3>${inner}</section>`;
    }

    function countInlineImages(t) {
      let n = 0;
      RICH_FIELDS.forEach((f) => {
        const v = t[f];
        if (v) n += (v.match(/<img[\s>]/gi) || []).length;
      });
      return n;
    }

    function buildSummary(task) {
      const inc = getSummaryInclude();
      return [
        `# ${task.title}`,
        '',
        inc.goal && task.goal && `${t('summary.goal')}\n${fieldPlain(task.goal)}`,
        inc.srs && task.srs && `${t('summary.srs')}\n${fieldPlain(task.srs)}`,
        inc.progress && task.progress && `${t('summary.progress')}\n${fieldPlain(task.progress)}`,
        inc.nextAction && task.nextAction && `${t('summary.nextAction')}\n${fieldPlain(task.nextAction)}`,
        inc.references && task.references && `${t('summary.references')}\n${fieldPlain(task.references)}`,
        inc.blockers && task.blockers && `${t('summary.blockers')}\n${fieldPlain(task.blockers)}`,
        inc.notes && task.notes && `${t('summary.notes')}\n${fieldPlain(task.notes)}`,
        inc.retrospective &&
          task.retrospective &&
          `${t('summary.retrospective')}\n${fieldPlain(task.retrospective)}`,
        task.attachments?.length
          ? [
              t('summary.attachments'),
              ...task.attachments.map(
                (a) => `- ${a.name} (${attachmentTypeLabel(a.kind)})`,
              ),
            ].join('\n')
          : '',
        '',
        inc.parkedAt && tf('time.summaryParked', { full: formatFull(task.parkedAt) }),
        inc.completedAt && task.completedAt && tf('time.summaryDone', { full: formatFull(task.completedAt) }),
      ].filter(Boolean).join('\n');
    }

    function buildAgentPrompt(task) {
      const sections = [
        t('agent.intro'),
        '',
        `${t('agent.task')}${task.title}`,
      ];
      if (task.goal) sections.push('', t('agent.goal'), fieldPlain(task.goal));
      if (task.srs) sections.push('', t('agent.srs'), fieldPlain(task.srs));
      if (task.progress) sections.push('', t('agent.progress'), fieldPlain(task.progress));
      if (task.nextAction) sections.push('', t('agent.nextAction'), fieldPlain(task.nextAction));
      if (task.references) sections.push('', t('agent.references'), fieldPlain(task.references));
      if (task.blockers) sections.push('', t('agent.blockers'), fieldPlain(task.blockers));
      if (task.notes) sections.push('', t('agent.notes'), fieldPlain(task.notes));
      if (task.retrospective) {
        sections.push('', t('agent.retrospective'), fieldPlain(task.retrospective));
      }
      if (task.attachments?.length) {
        sections.push('', t('agent.attachments'));
        task.attachments.forEach((a) => {
          sections.push(
            tf('agent.attachmentsList', {
              name: a.name,
              type: attachmentTypeLabel(a.kind),
            }),
          );
        });
      }
      const imgCount = countInlineImages(task);
      if (imgCount) {
        sections.push('', tf('agent.images', { n: imgCount }));
      }
      sections.push(
        '',
        tf('agent.timeParked', { full: formatFull(task.parkedAt) }),
        task.completedAt ? tf('agent.timeDone', { full: formatFull(task.completedAt) }) : '',
        '',
        t('agent.outro'),
      );
      return sections.filter((line) => line !== '').join('\n');
    }

    async function copyText(text, okMsg) {
      try {
        await navigator.clipboard.writeText(text);
        toast(okMsg);
      } catch {
        toast(t('toast.copyFailed'));
      }
    }

    function renderTaskListItem(task, { listKind, active }) {
      const nextPlain = listPreviewText(task.nextAction);
      const next = nextPlain ? `<div class="next-preview">${escapeHtml(nextPlain)}</div>` : '';
      const extraClass = listKind === 'history' ? ' history-item' : ' queued-item';
      const metaTime = listKind === 'history' ? task.completedAt : task.parkedAt;
      const metaKey = listKind === 'history' ? 'sidebar.metaDone' : 'sidebar.metaParked';
      const dataKind = listKind === 'history' ? 'history' : 'active';
      return `<li class="task-item${extraClass}${active}" data-id="${task.id}" data-kind="${dataKind}">
          <div class="title">${escapeHtml(listPreviewText(task.title))}</div>
          <div class="meta">${escapeHtml(tf(metaKey, { time: formatRelative(metaTime) }))}</div>
          ${next}
        </li>`;
    }

    function renderList() {
      const queued = getQueuedTasks();

      $('#queueCount').textContent = queued.length;
      $('#emptyQueue').classList.toggle('hidden', queued.length > 0);
      $('#queueList').innerHTML = queued
        .map((tsk) =>
          renderTaskListItem(tsk, {
            listKind: 'queued',
            active: !selectedFromHistory && tsk.id === selectedId,
          }),
        )
        .join('');

      const histSorted = [...history].sort((a, b) => new Date(b.completedAt) - new Date(a.completedAt));
      $('#historyCount').textContent = histSorted.length;
      $('#emptyHistory').classList.toggle('hidden', histSorted.length > 0);

      $('#historyList').innerHTML = histSorted
        .map((tsk) =>
          renderTaskListItem(tsk, {
            listKind: 'history',
            active: selectedFromHistory && tsk.id === selectedId,
          }),
        )
        .join('');

      document.querySelectorAll('.task-item').forEach((el) => {
        el.addEventListener('click', () => {
          navigateToTask(el.dataset.id, el.dataset.kind === 'history');
        });
      });
    }

    function isTaskEditing() {
      return !!$('#taskDetailView')?.classList.contains('is-editing');
    }

    function getTitleValue() {
      const el = $('#title');
      if (!el) return '';
      return (el.textContent || '').replace(/\u200b/g, '').trim();
    }

    function getFormPayload() {
      return {
        title: getTitleValue(),
        goal: getRichValue('goal'),
        srs: getRichValue('srs'),
        progress: getRichValue('progress'),
        nextAction: getRichValue('nextAction'),
        references: getRichValue('references'),
        blockers: getRichValue('blockers'),
        notes: getRichValue('notes'),
        retrospective: getRichValue('retrospective'),
      };
    }

    async function saveCurrentForm({ silent = false } = {}) {
      if (!isTaskEditing()) return { ok: true, skipped: true };
      const payload = getFormPayload();
      const existingId = $('#taskId').value;
      if (!payload.title) {
        if (!existingId) return { ok: true, skipped: true };
        if (!silent) toast(t('toast.needTitle'));
        return { ok: false };
      }
      const now = new Date().toISOString();
      if (existingId) {
        const idx = tasks.findIndex((x) => x.id === existingId);
        if (idx >= 0) {
          tasks[idx] = {
            ...tasks[idx],
            ...payload,
            attachments: cloneAttachments(draftAttachments),
            updatedAt: now,
          };
        }
        selectedId = existingId;
        selectedFromHistory = false;
      } else {
        const id = uid();
        tasks.push({
          id,
          ...payload,
          attachments: cloneAttachments(draftAttachments),
          parkedAt: now,
          updatedAt: now,
          scheduleState: 'queued',
        });
        $('#taskId').value = id;
        selectedId = id;
        selectedFromHistory = false;
        editingId = id;
      }
      try {
        await save();
        renderList();
        if (!silent) {
          toast(existingId ? t('toast.saved') : t('toast.parked'));
        }
        return { ok: true, id: selectedId };
      } catch {
        return { ok: false };
      }
    }

    async function navigateToTask(id, fromHistory) {
      if (id === selectedId && fromHistory === selectedFromHistory) {
        if (isTaskEditing() && !fromHistory && $('#taskId').value === id) {
          const result = await saveCurrentForm({ silent: true });
          if (!result.ok) return;
          const t = findTask(id, false);
          editingId = null;
          setTaskDetailMode(false, {});
          if (t) bindTaskDetailActions(t, false);
          linkifyAllRichFormFields();
        }
        return;
      }

      if (isTaskEditing()) {
        const formTaskId = $('#taskId').value;
        const switching = fromHistory || id !== formTaskId;
        if (switching) {
          const result = await saveCurrentForm({ silent: true });
          if (!result.ok) return;
        }
      }

      if (fromHistory) selectHistoryTask(id);
      else selectActiveResume(id);
    }

    function showView(name) {
      $('#welcomeView').classList.toggle('hidden', name !== 'welcome');
      $('#taskDetailView').classList.toggle('hidden', name !== 'task');
    }

    function findTask(id, fromHistory) {
      return fromHistory
        ? history.find((x) => x.id === id)
        : tasks.find((x) => x.id === id);
    }

    function populateTaskDetail(task, fromHistory) {
      $('#taskId').value = task.id;
      const titleEl = $('#title');
      if (titleEl) titleEl.textContent = task.title || '';
      const skip = { skipLinkify: true };
      RICH_FIELDS.forEach((id) => setRichValue(id, task[id] || '', skip));
      const badge = $('#detailBadge');
      const b = taskScheduleBadge(task, fromHistory);
      badge.textContent = b.text;
      badge.className = b.className;
      badge.classList.remove('hidden');
      const meta = $('#detailMeta');
      meta.textContent = formatParkedTimeLine(task, fromHistory);
      meta.classList.remove('hidden');
      draftAttachments = cloneAttachments(task.attachments);
      syncAllRichFieldEmptyStates();
      renderAttachmentsPanel(false);
    }

    function clearTaskDetailForNew() {
      $('#taskId').value = '';
      const titleEl = $('#title');
      if (titleEl) titleEl.textContent = '';
      const skip = { skipLinkify: true };
      RICH_FIELDS.forEach((id) => setRichValue(id, '', skip));
      $('#detailBadge').classList.add('hidden');
      $('#detailMeta').classList.add('hidden');
      draftAttachments = [];
      syncAllRichFieldEmptyStates();
      renderAttachmentsPanel(true);
    }

    function setTaskDetailMode(editing, {
      fromHistory = false,
      isNew = false,
      focusField = null,
      caretRange = null,
    } = {}) {
      const detail = $('#taskDetailView');
      if (!detail) return;
      const scrollY = window.scrollY;
      const mainEl = $('.main');
      const mainScroll = mainEl?.scrollTop ?? 0;
      const canEdit = editing && !fromHistory;
      detail.classList.toggle('is-editing', canEdit);
      detail.classList.toggle('is-history', fromHistory);
      detail.classList.toggle('is-new', isNew);
      $('#detailViewActions').classList.toggle('hidden', canEdit || isNew);
      $('#detailEditActions').classList.toggle('hidden', !canEdit);
      if (isNew) {
        $('#detailBadge').classList.add('hidden');
        $('#detailMeta').classList.add('hidden');
      }
      const titleEl = $('#title');
      if (titleEl) titleEl.contentEditable = canEdit ? 'true' : 'false';
      RICH_FIELDS.forEach((id) => {
        const el = document.getElementById(id);
        if (el) el.contentEditable = canEdit ? 'true' : 'false';
      });
      if (!canEdit) linkifyAllRichFormFields();
      syncAllRichFieldEmptyStates();
      renderAttachmentsPanel(canEdit);

      const shouldFocus = focusField || (canEdit && isNew);
      if (!shouldFocus) return;

      const field = focusField || 'title';
      const focusOpts = {
        caretRange: normalizeCaretRangeForField(field, caretRange),
        collapse: isNew && !caretRange ? 'end' : 'preserve',
      };

      const applyFocus = () => {
        restoreDocumentScroll(scrollY, mainScroll);
        focusFormField(field, focusOpts);
        restoreDocumentScroll(scrollY, mainScroll);
      };

      if (canEdit && caretRange) {
        applyFocus();
        return;
      }
      requestAnimationFrame(applyFocus);
    }

    function bindTaskDetailActions(task, fromHistory) {
      const host = $('#detailViewActions');
      if (!host || !task) return;
      if (fromHistory) {
        host.innerHTML = `
        <button type="button" id="btnCopyAgent">${escapeHtml(t('actions.agent'))}</button>
        <button type="button" id="btnCopyResume">${escapeHtml(t('actions.summary'))}</button>
        <button type="button" id="btnRestoreResume">${escapeHtml(t('actions.restore'))}</button>
        <button type="button" class="danger" id="btnDeleteHistory">${escapeHtml(t('actions.delete'))}</button>
      `;
        $('#btnCopyAgent').onclick = () => copyText(buildAgentPrompt(task), t('toast.copiedAgent'));
        $('#btnCopyResume').onclick = () => copyText(buildSummary(task), t('toast.copiedSummary'));
        $('#btnRestoreResume').onclick = () => restoreFromHistory(task.id);
        $('#btnDeleteHistory').onclick = () => deleteFromHistory(task.id);
      } else {
        host.innerHTML = `
        <button type="button" id="btnEditResume">${escapeHtml(t('actions.edit'))}</button>
        <button type="button" id="btnCopyAgent">${escapeHtml(t('actions.agent'))}</button>
        <button type="button" id="btnCopyResume">${escapeHtml(t('actions.summary'))}</button>
        <button type="button" id="btnDoneResume">${escapeHtml(t('actions.done'))}</button>
      `;
        $('#btnEditResume').onclick = () => enterTaskEdit();
        $('#btnCopyAgent').onclick = () => copyText(buildAgentPrompt(task), t('toast.copiedAgent'));
        $('#btnCopyResume').onclick = () => copyText(buildSummary(task), t('toast.copiedSummary'));
        $('#btnDoneResume').onclick = () => markDone(task.id);
      }
    }

    function enterTaskEdit(focusFieldId = null, { caretRange = null } = {}) {
      if (!selectedId || selectedFromHistory) return;
      const t = findTask(selectedId, false);
      if (!t) return;
      editingId = selectedId;
      setTaskDetailMode(true, { focusField: focusFieldId, caretRange });
      bindTaskDetailActions(t, false);
    }

    function selectHistoryTask(id) {
      selectedId = id;
      selectedFromHistory = true;
      editingId = null;
      const t = findTask(id, true);
      if (!t) {
        selectedId = null;
        selectedFromHistory = false;
        detailLoadedId = null;
        showView('welcome');
        renderList();
        return;
      }
      populateTaskDetail(t, true);
      detailLoadedId = id;
      detailLoadedFromHistory = true;
      renderList();
      setTaskDetailMode(false, { fromHistory: true });
      bindTaskDetailActions(t, true);
      showView('task');
    }

    function selectActiveResume(id) {
      selectedId = id;
      selectedFromHistory = false;
      editingId = null;
      const t = findTask(id, false);
      if (!t) {
        selectedId = null;
        detailLoadedId = null;
        showView('welcome');
        renderList();
        return;
      }
      const same = detailLoadedId === id && detailLoadedFromHistory === false;
      if (!same) populateTaskDetail(t, false);
      detailLoadedId = id;
      detailLoadedFromHistory = false;
      renderList();
      setTaskDetailMode(false, { fromHistory: false });
      bindTaskDetailActions(t, false);
      showView('task');
    }

    function selectActiveTask(id, focusFieldId = null) {
      selectedId = id;
      selectedFromHistory = false;
      const t = findTask(id, false);
      if (!t) {
        selectedId = null;
        showView('welcome');
        renderList();
        return;
      }
      const same = detailLoadedId === id && detailLoadedFromHistory === false;
      if (!same) populateTaskDetail(t, false);
      detailLoadedId = id;
      detailLoadedFromHistory = false;
      editingId = id;
      renderList();
      setTaskDetailMode(true, { focusField: focusFieldId });
      bindTaskDetailActions(t, false);
      showView('task');
    }

    function showActiveResume() {
      if (!selectedId || selectedFromHistory) return;
      selectActiveResume(selectedId);
    }

    function isRichFieldEmpty(el) {
      if (!el) return true;
      const text = (el.textContent || '').replace(/\u200b/g, '').trim();
      return !text && !el.querySelector('img');
    }

    function normalizeEmptyRichForCaret(el) {
      if (!el || !isRichFieldEmpty(el)) return;
      el.innerHTML = '';
    }

    function placeCaretInEmptyRich(el) {
      if (!el) return;
      normalizeEmptyRichForCaret(el);
      const sel = window.getSelection();
      if (!sel) return;
      if (!el.firstChild || el.firstChild.nodeType !== Node.TEXT_NODE) {
        el.appendChild(document.createTextNode(''));
      }
      const range = document.createRange();
      range.setStart(el.firstChild, 0);
      range.collapse(true);
      sel.removeAllRanges();
      sel.addRange(range);
    }

    function syncRichFieldEmptyState(el) {
      if (!el) return;
      el.classList.toggle('is-field-empty', isRichFieldEmpty(el));
    }

    function syncAllRichFieldEmptyStates() {
      ['title', ...RICH_FIELDS].forEach((id) => {
        syncRichFieldEmptyState(document.getElementById(id));
      });
    }

    function focusFormField(fieldId, { caretRange = null, collapse = 'preserve' } = {}) {
      const el = fieldId ? document.getElementById(fieldId) : null;
      if (!el) return;
      el.focus({ preventScroll: true });
      if (el instanceof HTMLInputElement || el instanceof HTMLTextAreaElement) {
        if (collapse === 'end') {
          const len = el.value.length;
          el.setSelectionRange(len, len);
        }
        return;
      }
      if (!el.classList?.contains('rich-input')) return;
      if (isRichFieldEmpty(el)) {
        placeCaretInEmptyRich(el);
        return;
      }
      const sel = window.getSelection();
      if (!sel) return;
      if (caretRange) {
        try {
          sel.removeAllRanges();
          sel.addRange(caretRange);
          return;
        } catch {
          /* fall through */
        }
      }
      if (collapse === 'preserve') return;
      const range = document.createRange();
      range.selectNodeContents(el);
      range.collapse(collapse === 'end' ? false : true);
      sel.removeAllRanges();
      sel.addRange(range);
    }

    function openForm(id = null, focusFieldId = null) {
      if (id) {
        selectActiveTask(id, focusFieldId);
        return;
      }
      editingId = null;
      selectedId = null;
      selectedFromHistory = false;
      detailLoadedId = null;
      detailLoadedFromHistory = false;
      clearTaskDetailForNew();
      renderList();
      setTaskDetailMode(true, { isNew: true, focusField: 'title' });
      $('#detailViewActions').innerHTML = '';
      showView('task');
    }

    const IMAGE_PREVIEW_ZOOM_MIN = 0.25;
    const IMAGE_PREVIEW_ZOOM_MAX = 8;
    let imagePreviewZoom = 1;
    let imagePreviewPanX = 0;
    let imagePreviewPanY = 0;
    let imagePreviewDrag = null;
    let imagePreviewSuppressClick = false;

    function applyImagePreviewTransform() {
      const img = $('#imagePreviewImg');
      if (!img) return;
      if (imagePreviewZoom === 1 && !imagePreviewPanX && !imagePreviewPanY) {
        img.style.transform = '';
        return;
      }
      img.style.transform = `translate(${imagePreviewPanX}px, ${imagePreviewPanY}px) scale(${imagePreviewZoom})`;
    }

    function resetImagePreviewView() {
      imagePreviewZoom = 1;
      imagePreviewPanX = 0;
      imagePreviewPanY = 0;
      applyImagePreviewTransform();
    }

    function showImagePreview(src) {
      const overlay = $('#imagePreviewOverlay');
      const img = $('#imagePreviewImg');
      if (!overlay || !img || !src) return;
      resetImagePreviewView();
      img.src = src;
      overlay.classList.remove('hidden');
    }

    function hideImagePreview() {
      const overlay = $('#imagePreviewOverlay');
      const img = $('#imagePreviewImg');
      if (!overlay) return;
      overlay.classList.remove('is-panning');
      overlay.classList.add('hidden');
      imagePreviewDrag = null;
      if (img) {
        img.removeAttribute('src');
        img.style.transform = '';
      }
      imagePreviewZoom = 1;
      imagePreviewPanX = 0;
      imagePreviewPanY = 0;
    }

    function initImagePreview() {
      const overlay = $('#imagePreviewOverlay');
      const stage = $('#imagePreviewStage');
      const img = $('#imagePreviewImg');
      if (!overlay || !stage || !img) return;
      $('#taskDetailView').addEventListener(
        'dblclick',
        (e) => {
          const thumb = e.target.closest('.rich-input img, .rich-body img');
          if (!thumb?.src) return;
          e.preventDefault();
          e.stopPropagation();
          showImagePreview(thumb.src);
        },
        true,
      );
      overlay.addEventListener('click', (e) => {
        if (e.target.closest('#imagePreviewImg, #imagePreviewStage')) return;
        hideImagePreview();
      });
      img.addEventListener('click', (e) => {
        e.stopPropagation();
        if (imagePreviewSuppressClick) {
          imagePreviewSuppressClick = false;
          e.preventDefault();
        }
      });
      const startPreviewPan = (e) => {
        if (overlay.classList.contains('hidden') || e.button !== 0) return;
        imagePreviewDrag = {
          startX: e.clientX,
          startY: e.clientY,
          panX: imagePreviewPanX,
          panY: imagePreviewPanY,
          moved: false,
        };
        overlay.classList.add('is-panning');
        e.preventDefault();
      };
      stage.addEventListener('mousedown', startPreviewPan);
      const movePreviewPan = (e) => {
        if (!imagePreviewDrag) return;
        const dx = e.clientX - imagePreviewDrag.startX;
        const dy = e.clientY - imagePreviewDrag.startY;
        if (Math.abs(dx) > 2 || Math.abs(dy) > 2) imagePreviewDrag.moved = true;
        imagePreviewPanX = imagePreviewDrag.panX + dx;
        imagePreviewPanY = imagePreviewDrag.panY + dy;
        applyImagePreviewTransform();
      };
      const endPreviewPan = () => {
        if (!imagePreviewDrag) return;
        if (imagePreviewDrag.moved) imagePreviewSuppressClick = true;
        imagePreviewDrag = null;
        overlay.classList.remove('is-panning');
      };
      document.addEventListener('mousemove', movePreviewPan);
      document.addEventListener('mouseup', endPreviewPan);
      overlay.addEventListener(
        'wheel',
        (e) => {
          if (overlay.classList.contains('hidden') || !e.ctrlKey) return;
          e.preventDefault();
          const factor = Math.pow(1.0015, -e.deltaY);
          imagePreviewZoom = Math.min(
            IMAGE_PREVIEW_ZOOM_MAX,
            Math.max(IMAGE_PREVIEW_ZOOM_MIN, imagePreviewZoom * factor),
          );
          applyImagePreviewTransform();
        },
        { passive: false },
      );
    }

    function initTaskDetailDblClick() {
      $('#taskDetailView').addEventListener('dblclick', (e) => {
        if (e.target.closest('.rich-input img, .rich-body img')) return;
        if (selectedFromHistory || !selectedId) return;
        if ($('#taskDetailView').classList.contains('is-editing')) return;
        if (e.target.closest('.detail-actions, button, a.rich-auto-link')) return;
        if (e.target.closest('.task-attachments-section, .task-attachment-open, .task-attachment-remove, .task-attachment-download')) {
          return;
        }
        const block = e.target.closest('[data-field]');
        if (block?.dataset.field === 'attachments') return;
        if (!block) return;
        e.preventDefault();
        const fieldId = block.dataset.field;
        const fieldEl = document.getElementById(fieldId);
        const caretRange = fieldEl && !isRichFieldEmpty(fieldEl)
          ? caretRangeFromPoint(e.clientX, e.clientY)
          : null;
        enterTaskEdit(fieldId, { caretRange });
      });
    }

    async function markDone(id) {
      if (isTaskEditing() && $('#taskId').value === id) {
        const result = await saveCurrentForm({ silent: true });
        if (!result.ok) return;
      }
      const ok = await confirmDialog(t('confirm.markDoneTitle'), t('confirm.markDoneMsg'));
      if (!ok) return;
      const idx = tasks.findIndex((x) => x.id === id);
      if (idx < 0) return;
      const task = tasks[idx];
      const now = new Date().toISOString();
      history.unshift({ ...task, completedAt: now, updatedAt: now });
      tasks.splice(idx, 1);
      await save();
      selectedFromHistory = true;
      selectedId = task.id;
      renderList();
      selectHistoryTask(task.id);
      toast(t('toast.movedToHistory'));
    }

    async function restoreFromHistory(id) {
      const idx = history.findIndex((x) => x.id === id);
      if (idx < 0) return;
      const task = history[idx];
      const now = new Date().toISOString();
      const { completedAt, ...rest } = task;
      const restored = { ...rest, parkedAt: now, updatedAt: now, scheduleState: 'queued' };
      tasks.push(restored);
      history.splice(idx, 1);
      await save();
      selectedFromHistory = false;
      selectedId = restored.id;
      renderList();
      selectActiveResume(restored.id);
      toast(t('toast.restored'));
    }

    async function deleteFromHistory(id) {
      const ok = await confirmDialog(t('confirm.deleteTitle'), t('confirm.deleteMsg'));
      if (!ok) return;
      history = history.filter((x) => x.id !== id);
      await save();
      if (selectedId === id) {
        selectedId = null;
        showView('welcome');
      }
      renderList();
      toast(t('toast.deletedHistory'));
    }

    function mergeImported(data) {
      const ids = new Set([...tasks, ...history].map((t) => t.id));
      (data.tasks || []).forEach((raw) => {
        const t = normalizeTask(raw);
        if (t && !ids.has(t.id)) {
          tasks.push(t);
          ids.add(t.id);
        }
      });
      (data.history || []).forEach((raw) => {
        const t = normalizeTask(raw);
        if (t && !ids.has(t.id)) {
          if (!t.completedAt) t.completedAt = t.updatedAt || new Date().toISOString();
          history.push(t);
          ids.add(t.id);
        }
      });
      migrateScheduleStates();
    }

    function replaceImported(data) {
      tasks = (data.tasks || []).map(normalizeTask).filter(Boolean);
      history = (data.history || []).map(normalizeTask).filter(Boolean);
      if (
        data.settings &&
        typeof data.settings.summaryInclude === 'object' &&
        data.settings.summaryInclude !== null
      ) {
        applySettingsFromStored(data.settings);
      } else {
        applySettingsFromStored(null);
      }
      migrateScheduleStates();
      applyLocale();
    }

    function parseImportFile(parsed) {
      if (Array.isArray(parsed)) {
        return { version: 1, tasks: parsed, history: [], settings: null };
      }
      if (parsed && typeof parsed === 'object') {
        return {
          version: parsed.version || 2,
          tasks: parsed.tasks || [],
          history: parsed.history || [],
          settings: parsed.settings || null,
        };
      }
      throw new Error('invalid');
    }

    function showImportDialog(data) {
      return new Promise((resolve) => {
        pendingImport = data;
        const total = (data.tasks?.length || 0) + (data.history?.length || 0);
        $('#importMessage').textContent = tf('import.message', {
          tasks: data.tasks?.length || 0,
          history: data.history?.length || 0,
          total,
        });
        const dlg = $('#importDialog');
        const cleanup = (result) => {
          dlg.close();
          $('#importMerge').removeEventListener('click', onMerge);
          $('#importReplace').removeEventListener('click', onReplace);
          $('#importCancel').removeEventListener('click', onCancel);
          pendingImport = null;
          resolve(result);
        };
        const onMerge = () => cleanup('merge');
        const onReplace = () => cleanup('replace');
        const onCancel = () => cleanup(null);
        $('#importMerge').addEventListener('click', onMerge);
        $('#importReplace').addEventListener('click', onReplace);
        $('#importCancel').addEventListener('click', onCancel);
        dlg.showModal();
      });
    }

    async function goWelcome() {
      if (isTaskEditing()) {
        const existingId = $('#taskId').value;
        if (existingId) {
          const result = await saveCurrentForm({ silent: true });
          if (!result.ok) return;
        }
      }
      editingId = null;
      selectedId = null;
      selectedFromHistory = false;
      detailLoadedId = null;
      detailLoadedFromHistory = false;
      showView('welcome');
      renderList();
    }

    function cancelFormEdit() {
      const existingId = $('#taskId').value;
      if (existingId) {
        const t = findTask(existingId, false);
        if (t) populateTaskDetail(t, false);
        editingId = null;
        detailLoadedId = existingId;
        detailLoadedFromHistory = false;
        setTaskDetailMode(false, { fromHistory: false });
        bindTaskDetailActions(t, false);
        linkifyAllRichFormFields();
        return;
      }
      goWelcome();
    }

    async function submitFormEdit() {
      const result = await saveCurrentForm({ silent: false });
      if (!result.ok) return;
      if (result.id) {
        const t = findTask(result.id, false);
        editingId = null;
        detailLoadedId = result.id;
        detailLoadedFromHistory = false;
        setTaskDetailMode(false, { fromHistory: false });
        if (t) bindTaskDetailActions(t, false);
        linkifyAllRichFormFields();
      } else {
        detailLoadedId = null;
        showView('welcome');
      }
    }

    $('#taskForm').addEventListener('submit', (e) => {
      e.preventDefault();
      submitFormEdit();
    });
    $('#btnCancelForm').onclick = () => cancelFormEdit();

    async function startNewTask() {
      if (isTaskEditing()) {
        const result = await saveCurrentForm({ silent: true });
        if (!result.ok) return;
      }
      openForm();
    }

    $('#btnHome').onclick = () => goWelcome();
    $('#btnNew').onclick = () => startNewTask();

    $('#btnExport').onclick = () => {
      const blob = new Blob([JSON.stringify(getExportPayload(), null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `resumepad-${new Date().toISOString().slice(0, 10)}.json`;
      a.click();
      URL.revokeObjectURL(a.href);
      toast(t('toast.exported'));
    };

    $('#btnImport').onclick = () => $('#importFile').click();

    $('#importFile').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      try {
        const data = parseImportFile(JSON.parse(await file.text()));
        const action = await showImportDialog(data);
        if (!action) return;
        if (action === 'merge') {
          mergeImported(data);
          if (data.settings) {
            applySettingsFromStored(data.settings);
            applyLocale();
          }
        } else {
          replaceImported(data);
        }
        await save();
        renderList();
        showView('welcome');
        toast(t('toast.importOk'));
      } catch {
        toast(t('toast.importBad'));
      }
      e.target.value = '';
    });

    document.addEventListener('keydown', (e) => {
      if (e.target.matches('input, textarea, [contenteditable="true"]') && e.key !== 'Escape') return;
      if (e.key === 'n' || e.key === 'N') {
        e.preventDefault();
        startNewTask();
      }
      if (e.key === 't' || e.key === 'T') {
        if (e.target.matches('input, textarea, [contenteditable="true"]')) return;
        e.preventDefault();
        toggleTheme();
      }
      if (e.key === 'Escape') {
        const attPreview = $('#attachmentPreviewOverlay');
        if (attPreview && !attPreview.classList.contains('hidden')) {
          e.preventDefault();
          hideAttachmentPreview();
          return;
        }
        const preview = $('#imagePreviewOverlay');
        if (preview && !preview.classList.contains('hidden')) {
          e.preventDefault();
          hideImagePreview();
          return;
        }
        if (!isTaskEditing()) return;
        e.preventDefault();
        cancelFormEdit();
      }
    });

    async function boot() {
      try {
      initSidebarResize();
      initRichFields();
      initImagePreview();
      initAttachments();
      initTaskDetailDblClick();
      if (!window.indexedDB) {
        toast(t('toast.noIdb'));
        return;
      }
      await migrateFromLocalStorage();
      await load();
      applyLocale();
      initSettingsDialog();
      renderList();
      showView('welcome');
      } finally {
        document.documentElement.dataset.appReady = '1';
      }
    }

    boot();
  </script>
</body>
</html>
